name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
      - run: go test -p 1 ./... -count=1
      - run: go vet -p 1 ./...
      - run: go vet -asmdecl ./core
